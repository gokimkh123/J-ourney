# J-ourney 비밀값·개인정보 검사 규칙 (gitleaks 기본 규칙 + 프로젝트 규칙)
title = "J-ourney gitleaks 설정"

[extend]
useDefault = true

[[rules]]
id = "kakao-rest-api-key"
description = "카카오 REST API 키"
regex = '''(?i)(?:KakaoAK\s+|KAKAO_REST_API_KEY\s*[:=]\s*["']?)([0-9a-f]{32})'''
secretGroup = 1
keywords = ["kakaoak", "kakao_rest_api_key"]

[[rules]]
id = "data-go-kr-service-key"
description = "공공데이터포털 인증키"
regex = '''(?i)(?:serviceKey=|DATA_GO_KR_SERVICE_KEY\s*[:=]\s*["']?)([0-9a-f]{64})'''
secretGroup = 1
keywords = ["servicekey", "data_go_kr_service_key"]

[[rules]]
id = "korean-mobile-number"
description = "휴대전화 번호 (개인정보)"
regex = '''(?:^|[^0-9])(01[016789][- .]?[0-9]{3,4}[- .]?[0-9]{4})(?:[^0-9]|$)'''
secretGroup = 1

[[rules]]
id = "korean-resident-registration-number"
description = "주민등록번호 (개인정보)"
regex = '''(?:^|[^0-9])([0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])-[1-4][0-9]{6})(?:[^0-9]|$)'''
secretGroup = 1
