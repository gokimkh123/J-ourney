<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J-ourney 회의 엔진 시험</title>
<style>
  /* 화면 구성: 위 1–15단계 목록 → 고른 단계의 실행 버튼과 실제 결과 (서버 API를 그대로 부름) */
  :root {
    --bg: #F3F5F7; --surface: #FFFFFF; --soft: #F8FAFB; --ink: #15202B; --muted: #5A6774; --line: #DCE2E8;
    --code: #2457D6; --code-soft: #E7EEFD; --llm: #6D3FD8; --llm-soft: #F0E9FD; --human: #D2560F; --human-soft: #FCEBDD;
    --ok: #0C7F57; --ok-soft: #DFF3EA; --warn: #A3540A; --warn-soft: #FDF0D5; --bad: #B4231F; --bad-soft: #FBE3E1;
    --pre-bg: #0F1720; --pre-ink: #D5DEE8;
    --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "Cascadia Code", Consolas, "D2Coding", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1318; --surface: #141C23; --soft: #10171D; --ink: #E4EBF1; --muted: #98A6B3; --line: #25313C;
      --code: #7FA6FF; --code-soft: #172440; --llm: #B39BFF; --llm-soft: #231A3B; --human: #FF9A5C; --human-soft: #36210F;
      --ok: #3CC48F; --ok-soft: #10302A; --warn: #F2B356; --warn-soft: #342610; --bad: #FF7B72; --bad-soft: #3A1715; --pre-bg: #0A1015;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.55; word-break: keep-all; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 60px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 26px; } h2 { margin: 0; font-size: 18px; } h3 { margin: 0; font-size: 14px; color: var(--muted); }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .step { text-align: left; font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; }
  .step b { font-size: 13.5px; }
  .step small { font-size: 11.5px; color: var(--muted); }
  .step.live { border-color: var(--ok); }
  .step.now { box-shadow: 0 0 0 2px var(--ink) inset; }
  .step.locked { opacity: .55; cursor: not-allowed; }
  .k { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 99px; margin-right: 4px; }
  .k.code { background: var(--code-soft); color: var(--code); } .k.llm { background: var(--llm-soft); color: var(--llm); } .k.human { background: var(--human-soft); color: var(--human); } .k.end { background: var(--ok-soft); color: var(--ok); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.btn { font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 7px 14px; cursor: pointer; }
  button.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button.btn:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--code); outline-offset: 2px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); margin: 2px 3px 2px 0; white-space: nowrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .note { font-size: 12.5px; color: var(--muted); }
  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .stat > div { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .tw { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 12px; color: var(--muted); white-space: nowrap; }
  td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  td.best { color: var(--ok); font-weight: 700; }
  pre { margin: 0; background: var(--pre-bg); color: var(--pre-ink); border-radius: 12px; padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 1.55; overflow: auto; max-height: 340px; white-space: pre; }
  .members { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .member { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .member ol { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 13px; }
  .err { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
  .locked-box { background: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="card" style="gap:6px">
    <p class="note">J-ourney 서버 · 이 PC에서만 열림 (DEV_UI)</p>
    <h1>회의 엔진 단계별 시험</h1>
    <p class="muted">1–15단계를 하나씩 실제 서버로 실행해 봅니다. 결과는 실제 DB·API 값이고, 아직 만들지 않은 단계는 잠겨 있습니다.</p>
  </header>

  <section class="card" aria-labelledby="t-steps">
    <h2 id="t-steps">단계</h2>
    <div class="steps" id="steps"></div>
  </section>

  <section class="card" id="panel" aria-live="polite"></section>
</div>

<script>
const STEPS = [
  { n: 1, name: '준비', kind: 'code', live: true, desc: '시연 여행(4명 성향) + 회의 조건' },
  { n: 2, name: '후보 찾기', kind: 'code', live: true, desc: 'DB·인기도·혼잡도 → 40곳' },
  { n: 3, name: '고르기 ×4', kind: 'llm', desc: 'AI 4명이 각자 3곳' },
  { n: 4, name: '후보 보드', kind: 'code', desc: '4명 반응 👍 ⚠ ✕' },
  { n: 5, name: '사람 확인', kind: 'human', desc: '빼기·넣기 (interrupt)' },
  { n: 6, name: '일정 배치', kind: 'code', desc: 'A안·B안 시간 계산' },
  { n: 7, name: '평가 1라운드', kind: 'llm', desc: '4명 찬반·요청' },
  { n: 8, name: '집계', kind: 'code', desc: '만족도 계산' },
  { n: 9, name: '수정', kind: 'code', desc: '요청대로 바꾸기' },
  { n: 10, name: '사회자', kind: 'code', desc: '다음 발언자 고르기' },
  { n: 11, name: '평가 2라운드', kind: 'llm', desc: '부른 AI만' },
  { n: 12, name: '집계', kind: 'code', desc: '통과 확인' },
  { n: 13, name: '마무리', kind: 'llm', desc: 'A·B 설명 + 카카오' },
  { n: 14, name: '사람 선택', kind: 'human', desc: '2안 중 하나' },
  { n: 15, name: '확정', kind: 'end', desc: '일정 확정' },
];
const KIND = { code: '코드', llm: 'LLM', human: '사람', end: '끝' };
const KEY = 'journey-dev-meeting';
let cur = 1;
let saved = load();
let last = null;

function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } }
function store(v) { saved = v; try { localStorage.setItem(KEY, JSON.stringify(v)); } catch { /* 저장 불가 환경은 무시 */ } }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const $ = (id) => document.getElementById(id);

async function api(method, path, body) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (saved?.token) headers.Authorization = `Bearer ${saved.token}`;
  const res = await fetch('/api/v1' + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error ? `${json.error.code}: ${json.error.message}` : `HTTP ${res.status}`);
  return json;
}

function renderSteps() {
  $('steps').innerHTML = STEPS.map((s) => `<button type="button" class="step ${s.live ? 'live' : 'locked'} ${s.n === cur ? 'now' : ''}" data-n="${s.n}" ${s.live ? '' : 'aria-disabled="true"'}>
    <b><span class="k ${s.kind}">${KIND[s.kind]}</span>${s.n}. ${esc(s.name)}</b><small>${s.live ? esc(s.desc) : '준비 중 · ' + esc(s.desc)}</small></button>`).join('');
}
$('steps').addEventListener('click', (e) => {
  const b = e.target.closest('[data-n]');
  if (!b) return;
  const s = STEPS[Number(b.dataset.n) - 1];
  if (!s.live) return;
  cur = s.n;
  render();
});

function nextSaturday() {
  const d = new Date();
  d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7));
  return d.toISOString().slice(0, 10);
}

/* 1단계: 시연 여행 + 회의 조건 */
async function renderStep1() {
  const p = $('panel');
  p.innerHTML = `<h2>1. 준비 <span class="k code">코드</span></h2>
    <p class="muted">시연 여행을 만들면 방장(민수) + 가상 구성원 3명(지은·현우·서연)이 생깁니다. 방장 성향 카드는 실제 API로 만들어 <b>LLM 1회</b>가 쓰입니다 (구성원당 2회 상한). 한 번 만든 여행은 이 브라우저에 저장해 다시 씁니다.</p>
    <div class="row"><button class="btn primary" id="mk">새 시연 여행 만들기</button>${saved ? '<span class="pill">저장된 여행 있음</span>' : ''}<span id="mkMsg" class="note"></span></div>
    <div id="trip"></div>`;
  $('mk').onclick = async () => {
    $('mk').disabled = true;
    $('mkMsg').textContent = '만드는 중…';
    try {
      saved = null;
      const t = await api('POST', '/trips', { title: '부산 시연', nickname: '민수', demoMode: true });
      store({ tripId: t.trip.id, token: t.token });
      const scale = [9, 8, 6, 3, 8, 7, 2, 3, 5, 8, 3, 4];
      const answers = [...scale.map((value, i) => ({ questionId: `q${i + 1}`, value })), { questionId: 'q13', optionIds: ['like_night', 'like_sea', 'like_festival'] }, { questionId: 'q14', optionIds: [] }];
      await api('POST', '/me/persona', { answers });
      $('mkMsg').textContent = '만들었습니다.';
      await showTrip();
    } catch (err) { $('mkMsg').innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    $('mk').disabled = false;
  };
  if (saved) await showTrip();
}

async function showTrip() {
  const box = $('trip');
  try {
    const t = await api('GET', `/trips/${saved.tripId}`);
    const c = t.conditions;
    box.innerHTML = `<div class="members">${t.members.map((m) => `<div class="member"><b>${esc(m.nickname)}${m.isHost ? ' (방장)' : ''}</b><span class="${m.personaReady ? 'ok' : 'warn'}">${m.personaReady ? '성향 준비됨 · ' + esc(m.title) : '성향 없음'}</span></div>`).join('')}</div>
      <h3>회의 조건 (PUT /trips/{tripId}/conditions)</h3>
      <div class="grid2">
        <label>목적지<input id="dst" value="${esc(c?.destination ?? '부산')}"></label>
        <label>시작하는 날<input id="sd" type="date" value="${esc(c?.startDate ?? nextSaturday())}"></label>
        <label>끝나는 날<input id="ed" type="date" value="${esc(c?.endDate ?? c?.startDate ?? nextSaturday())}"></label>
        <label>1인 예산(원, 선택)<input id="bg" type="number" min="0" value="${esc(c?.budgetPerPerson ?? '')}"></label>
      </div>
      <div class="row"><button class="btn primary" id="save">조건 저장</button><span id="saveMsg" class="note">${c ? '저장된 조건: ' + esc(c.destination) + ' · ' + esc(c.startDate) + (c.endDate !== c.startDate ? '~' + esc(c.endDate) : '') : '아직 저장 안 함'}</span></div>
      <p class="note">혼잡도 예측은 오늘부터 30일 안의 날짜에만 있습니다. 여행은 3일까지.</p>`;
    $('save').onclick = async () => {
      try {
        const budget = $('bg').value.trim();
        const r = await api('PUT', `/trips/${saved.tripId}/conditions`, { destination: $('dst').value, startDate: $('sd').value, endDate: $('ed').value, budgetPerPerson: budget ? Number(budget) : null });
        $('saveMsg').innerHTML = `<span class="ok">저장함: ${esc(r.destination.label)} (지역 코드 ${esc(r.destination.regionCode)})</span> → 2단계로`;
      } catch (err) { $('saveMsg').innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    };
  } catch (err) {
    box.innerHTML = `<div class="err">${esc(err.message)} · 새 시연 여행을 만들어 주세요</div>`;
  }
}

/* 2단계: 후보 찾기 */
function renderStep2() {
  const p = $('panel');
  p.innerHTML = `<h2>2. 후보 찾기 <span class="k code">코드 · LLM 0회</span></h2>
    <p class="muted">LangGraph 그래프 <span class="mono">prepare → retrieve</span>를 실제로 실행합니다. 장소 DB에서 거르고, 4명 성향으로 점수를 매겨 40곳을 고릅니다. 혼잡도는 구·군마다 하루 1번만 API로 받고, 같은 날 다시 실행하면 저장한 값을 씁니다.</p>
    <div class="row"><button class="btn primary" id="run">후보 찾기 실행</button><span id="runMsg" class="note"></span></div>
    <div id="out">${last ? '' : '<div class="locked-box">실행하면 결과가 여기에 나옵니다.</div>'}</div>`;
  $('run').onclick = async () => {
    if (!saved) { $('runMsg').innerHTML = '<span class="bad">1단계에서 시연 여행부터 만들어 주세요</span>'; return; }
    $('run').disabled = true;
    $('runMsg').textContent = '실행 중…';
    try {
      last = await api('POST', '/dev/meeting/retrieve', {});
      $('runMsg').textContent = `${last.ms.toLocaleString('ko-KR')}ms`;
      showRetrieve();
    } catch (err) { $('runMsg').innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
    $('run').disabled = false;
  };
  if (last) showRetrieve();
}

function showRetrieve() {
  const r = last.retrieve;
  const people = last.members;
  const nameOf = Object.fromEntries(people.map((m) => [m.memberId, m.nickname]));
  const typeName = { 12: '관광지', 14: '문화시설', 15: '축제', 28: '레포츠', 39: '음식점' };
  const crowdNote = r.crowd.note === 'out_of_window' ? '여행 날짜가 30일 밖이라 예측 없음' : r.crowd.note ? `멈춤: ${r.crowd.note}` : `새로 받음 ${r.crowd.fetched.length}곳 · 저장한 것 씀 ${r.crowd.cached.length}곳`;
  const best = (c) => Math.max(...Object.values(c.scores));
  const top = people.map((m) => {
    const mine = r.candidates.filter((c) => c.forMembers.includes(m.memberId)).sort((a, b) => b.scores[m.memberId] - a.scores[m.memberId]);
    return `<div class="member"><b>${esc(m.nickname)} 몫 · ${esc(m.title)}</b><ol>${mine.map((c) => `<li>${esc(c.name)} <span class="mono">${c.scores[m.memberId]}</span> <span class="note">${esc(c.reasons[m.memberId].join(' · ') || '점수 합으로 채움')}</span></li>`).join('')}</ol></div>`;
  }).join('');
  $('out').innerHTML = `
    <div class="stat">
      ${r.stages.map((s) => `<div><span class="note">${esc(s.label)}</span><b>${s.count.toLocaleString('ko-KR')}곳</b></div>`).join('')}
      <div><span class="note">인기도 (연관 관광지 ${esc(r.popularity.baseYm ?? '자료 없음')})</span><b>${r.popularity.matched}곳</b></div>
      <div><span class="note">혼잡도 (${esc(r.dates.join(', '))})</span><b>${r.crowd.matched}곳</b><span class="note">${esc(crowdNote)}</span></div>
    </div>
    <div><h3>거른 이유</h3>${r.excluded.length ? r.excluded.map((e) => `<span class="pill">${esc(e.reason)} ${e.count}곳 · 예: ${esc(e.examples.join(', '))}</span>`).join('') : '<span class="note">없음</span>'}</div>
    <div><h3>사람별 몫 (점수 상위 8곳)</h3><div class="members">${top}</div></div>
    <div><h3>후보 ${r.candidates.length}곳 (점수 합 순)</h3><div class="tw"><table>
      <thead><tr><th>이름</th><th>유형</th><th>공식 분류</th><th>인기</th><th>혼잡</th><th>영업</th>${people.map((m) => `<th>${esc(m.nickname)}</th>`).join('')}<th>합</th><th>몫</th></tr></thead>
      <tbody>${r.candidates.map((c) => `<tr><td>${esc(c.name)}${c.restUnknown ? ' <span class="warn" title="휴무일 문장을 읽지 못함">휴무 확인</span>' : ''}</td><td>${typeName[c.type] ?? c.type}</td><td>${esc(c.category ?? '-')}</td><td class="n">${c.popularity ?? '-'}</td><td class="n">${c.crowd ?? '-'}</td><td>${esc(c.hours ?? '-')}</td>${people.map((m) => `<td class="n ${c.scores[m.memberId] === best(c) && best(c) > 0 ? 'best' : ''}">${c.scores[m.memberId]}</td>`).join('')}<td class="n">${c.total}</td><td>${c.forMembers.map((id) => `<span class="pill">${esc(nameOf[id])}</span>`).join('')}</td></tr>`).join('')}</tbody></table></div></div>
    <div><h3>LLM에 넣을 한 줄 표 (3단계 고르기 입력 · ${r.table.length.toLocaleString('ko-KR')}자)</h3><pre>${esc(r.table)}</pre></div>
    <p class="note">근거: ${esc(r.sources.join(', '))} · 기준일 ${esc(r.baseDate)} · 장소 정보 ⓒ한국관광공사</p>`;
}

function render() {
  renderSteps();
  if (cur === 1) renderStep1();
  else if (cur === 2) renderStep2();
}
render();
</script>
</body>
</html>
