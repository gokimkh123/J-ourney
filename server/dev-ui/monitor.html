<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J-ourney 관리자 모니터</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --line: #e3e6eb; --text: #17191c; --muted: #6b7280; --bad: #dc2626; --warn: #b45309; --good: #15803d; --accent: #1e2126; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Pretendard, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--accent); color: #fff; }
  header h1 { font-size: 15px; margin: 0; }
  header .muted { color: #c9ced6; }
  header button, header select { font: inherit; padding: 4px 10px; border-radius: 8px; border: 0; }
  main { padding: 12px 16px 40px; display: grid; gap: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .card b { display: block; font-size: 20px; margin-top: 2px; }
  .card small { color: var(--muted); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
  section h2 { font-size: 13px; margin: 0 0 6px; }
  section p.note { color: var(--muted); margin: 0 0 6px; }
  .scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; white-space: nowrap; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bad { color: var(--bad); font-weight: 600; }
  .warn { color: var(--warn); }
  .good { color: var(--good); }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>관리자 모니터</h1>
  <span class="muted" id="now">-</span>
  <button id="pause">멈춤</button>
  <label class="muted">주소 <select id="route"><option value="">전체</option></select></label>
  <span class="muted">서버 컴퓨터에서만 열림 · 기록은 서버 메모리의 최근 500개 (토큰·키·초대 코드·IP 원문 없음)</span>
</header>
<main>
  <div class="cards" id="cards"></div>
  <section>
    <h2>주소별 1분 횟수 (최근 10분)</h2>
    <p class="note">같은 주소가 1분에 너무 많이 불리면 앱이 같은 요청을 반복하는 것 (예: 초대 확인은 3초마다라 1분 20번 안팎이 정상)</p>
    <div class="scroll"><table id="minutes"></table></div>
  </section>
  <section>
    <h2>WebSocket 열림·닫힘</h2>
    <p class="note">정상: 여행 화면에 들어갈 때 한 번 열려 계속 유지됨. 몇 초마다 열림·닫힘이 반복되거나 afterSeq가 늘 0이면 앱이 매번 새로 여는 것</p>
    <div class="scroll"><table id="sockets"></table></div>
  </section>
  <section>
    <h2>진행 중인 회의</h2>
    <div class="scroll"><table id="meetings"></table></div>
  </section>
  <section>
    <h2>최근 요청</h2>
    <div class="scroll"><table id="requests"></table></div>
  </section>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const $ = (id) => document.getElementById(id);
const REFRESH_MS = 2000;
const CLOSE_TEXT = { 1000: '정상 종료', 1001: '떠남 (앱이 화면을 닫음)', 1005: '까닭 없음', 1006: '비정상 끊김 (네트워크)', 1011: '서버 오류', 4000: '같은 사람이 새 연결을 열어 밀려남 (한 사람당 2개)' };
let paused = false;
let last = null;
$('pause').onclick = () => {
  paused = !paused;
  $('pause').textContent = paused ? '다시 보기' : '멈춤';
};
$('route').onchange = () => last && draw(last);
const statusClass = (s) => (s >= 500 ? 'bad' : s >= 400 ? 'warn' : s === 101 ? 'good' : '');
const table = (el, head, rows) => {
  el.innerHTML = `<tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr>${rows.join('') || `<tr><td colspan="${head.length}" class="muted">없음</td></tr>`}`;
};

function draw(d) {
  $('now').textContent = d.now ?? '';
  const nowMinute = (d.now ?? '').slice(11, 16);
  const lastMin = d.perMinute.find((m) => m.minute === nowMinute)?.routes ?? {};
  const recent = d.requests.filter((r) => r.at.slice(11, 16) === nowMinute);
  const opens = d.sockets.filter((s) => s.event === 'open').length;
  const closes = d.sockets.filter((s) => s.event === 'close').length;
  const apis = d.apisToday ?? {};
  const sum = (prefix) => Object.entries(apis).filter(([k]) => k.startsWith(prefix)).reduce((n, [, v]) => n + v, 0);
  const cards = [
    ['이번 1분 요청', Object.values(lastMin).reduce((a, b) => a + b, 0), '이 화면이 묻는 것은 빼고 셈'],
    ['이번 1분 오류', recent.filter((r) => r.status >= 400).length, '400 이상 (빨강·주황)'],
    ['열린 WebSocket (어림)', Math.max(0, opens - closes), `기록 안 열림 ${opens} · 닫힘 ${closes}`],
    ['오늘 AI 호출', d.llmToday ?? '-', '서버 하루 횟수표 (녹화 재생은 세지 않음)'],
    ['오늘 카카오', sum('kakao/'), `자동차 ${apis['kakao/directions'] ?? 0} · 대중교통 ${apis['kakao/publictraffic'] ?? 0} · 도보 ${apis['kakao/walk'] ?? 0}`],
    ['오늘 관광공사', sum('TatsCnctrRateService/') + sum('detail'), `혼잡 ${sum('TatsCnctrRateService/')} · 상세 수집 ${sum('detail')}`],
    ['진행 중 회의', (d.meetings ?? []).length, 'running · reviewing'],
  ];
  $('cards').innerHTML = cards.map(([t, v, s]) => `<div class="card"><small>${esc(t)}</small><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join('');

  const routes = [...new Set(d.perMinute.flatMap((m) => Object.keys(m.routes)))].sort();
  const sel = $('route');
  const chosen = sel.value;
  sel.innerHTML = `<option value="">전체</option>${routes.map((r) => `<option ${r === chosen ? 'selected' : ''}>${esc(r)}</option>`).join('')}`;
  table($('minutes'), ['주소', ...d.perMinute.map((m) => m.minute)], routes.map((r) => `<tr><td><code>${esc(r)}</code></td>${d.perMinute.map((m) => `<td class="num">${m.routes[r] ?? ''}</td>`).join('')}</tr>`));

  table(
    $('sockets'),
    ['시각', '사건', '여행', '구성원', '받기 시작(afterSeq)', '닫힌 까닭', '열린 시간', '보낸 글', '누가', '기기'],
    d.sockets.slice(0, 100).map(
      (s) =>
        `<tr><td>${esc(s.at.slice(11, 19))}</td><td class="${s.event === 'open' ? 'good' : ''}">${s.event === 'open' ? '열림' : '닫힘'}</td><td><code>${esc(s.tripId)}</code></td><td><code>${esc(s.memberId)}</code></td>` +
        `<td class="num">${s.afterSeq ?? ''}</td><td class="${s.code === 4000 || s.code === 1006 || s.code === 1011 ? 'warn' : ''}">${s.code ? esc(`${s.code} ${CLOSE_TEXT[s.code] ?? s.reason ?? ''}`) : ''}</td>` +
        `<td class="num">${s.seconds != null ? `${s.seconds}초` : ''}</td><td class="num">${s.sent ?? ''}</td><td>${esc(s.who)}</td><td>${esc(s.client)}</td></tr>`,
    ),
  );

  table(
    $('meetings'),
    ['회의', '여행', '상태', '시작', '이번 회의 AI'],
    (d.meetings ?? []).map((m) => `<tr><td><code>${esc(m.id)}</code></td><td><code>${esc(m.tripId)}</code></td><td>${esc(m.status)}</td><td>${esc(m.startedAt.slice(11, 19))}</td><td class="num">${m.llmCalls}</td></tr>`),
  );

  const shown = d.requests.filter((r) => !chosen || r.route === chosen).slice(0, 200);
  table(
    $('requests'),
    ['시각', '누가', '기기', '방법', '주소', '결과', '걸린 시간'],
    shown.map(
      (r) =>
        `<tr><td>${esc(r.at.slice(11, 19))}</td><td>${esc(r.who)}</td><td>${esc(r.client)}</td><td>${esc(r.method)}</td><td><code>${esc(r.path)}</code></td>` +
        `<td class="num ${statusClass(r.status)}">${r.status}</td><td class="num">${r.ms}ms</td></tr>`,
    ),
  );
}

async function tick() {
  if (!paused) {
    try {
      const res = await fetch('/dev/monitor/data', { cache: 'no-store' });
      if (res.ok) {
        last = await res.json();
        draw(last);
      } else $('now').textContent = `불러오지 못함 (${res.status})`;
    } catch {
      $('now').textContent = '서버에 연결되지 않음';
    }
  }
  setTimeout(tick, REFRESH_MS);
}
tick();
</script>
</body>
</html>
