name: CI

# main에는 develop에서 검사를 마친 코드만 들어오므로 main 대상으로는 실행하지 않음
on:
  push:
    branches: [develop, 'server/**', 'app/**']
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 비밀값 검사 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 전체 커밋 기록 검사 (기본 규칙 + .gitleaks.toml의 프로젝트 규칙)
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  server:
    name: 서버 검사 (타입·테스트·빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker 이미지 빌드·실행 확인
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드
        run: docker build -t j-ourney-server:ci server
      - name: 이미지 비밀값 검사
        run: bash .github/scripts/scan-image.sh j-ourney-server:ci
      - name: 컨테이너 실행 후 상태 확인
        run: |
          docker run -d --name server -p 3000:3000 j-ourney-server:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1
