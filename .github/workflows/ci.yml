name: CI

on:
  push:
    branches: [main, develop, 'server/**', 'app/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 서버 검사 (타입·테스트·빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker 이미지 빌드·실행 확인
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드
        run: docker build -t j-ourney-server:ci server
      - name: 컨테이너 실행 후 상태 확인
        run: |
          docker run -d --name server -p 3000:3000 j-ourney-server:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1
